name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ripgrep
        shell: pwsh
        run: |
          choco install ripgrep --yes --no-progress
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            throw "ripgrep installation did not provide rg"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/owstats-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: apps/owstats-desktop
        run: npm ci

      - name: Configure stable test temp directory
        shell: pwsh
        run: |
          $ciTemp = Join-Path $env:GITHUB_WORKSPACE ".ci-temp"
          New-Item -ItemType Directory -Force -Path $ciTemp | Out-Null
          "TEMP=$ciTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$ciTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run reproducible verification
        shell: pwsh
        run: ./scripts/verify.ps1 -SkipCheckout
